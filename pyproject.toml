[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-figure-story-sharepack"
version = "1.0.1"
description = "Scientific storytelling portrait cards from reviewed evidence, optionally linked to PFS"
readme = "README.md"
license = "LicenseRef-SharePack-Personal-Noncommercial-1.0"
license-files = ["LICENSE", "LICENSE_STATUS.md", "NOTICE*.md"]
requires-python = ">=3.10"
authors = [{name = "PFS SharePack contributors"}]
dependencies = ["pypdfium2>=5.15.2,<6", "pypdf>=6.21.4,<7", "python-pptx>=0.6.23,<2", "Pillow>=10,<13"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
sharepack = "sharepack.cli:main"
sharepack-brand = "sharepack.brand_tool:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sharepack*"]
