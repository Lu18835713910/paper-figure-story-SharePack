[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-figure-story-sharepack"
version = "0.1.0rc1"
description = "Scientific storytelling portrait cards from reviewed evidence, optionally linked to PFS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "PFS SharePack contributors"}]
dependencies = ["PyMuPDF>=1.24,<2", "python-pptx>=0.6.23,<2", "Pillow>=10,<13"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
sharepack = "sharepack.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sharepack*"]
